<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#1a6eb5"/>

  <!-- Snowflake: 6 arms at 0, 60, 120, 180, 240, 300 degrees, drawn as rotated copies -->
  <g stroke="white" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- Arm template: main shaft + 2 symmetric branches + tip diamond, rotated 6 times -->
    <g transform="rotate(0, 64, 64)">
      <!-- Main shaft -->
      <line x1="64" y1="14" x2="64" y2="114" stroke-width="7"/>
      <!-- Upper branches -->
      <line x1="64" y1="36" x2="45" y2="22" stroke-width="5"/>
      <line x1="64" y1="36" x2="83" y2="22" stroke-width="5"/>
      <!-- Lower branches -->
      <line x1="64" y1="92" x2="45" y2="106" stroke-width="5"/>
      <line x1="64" y1="92" x2="83" y2="106" stroke-width="5"/>
      <!-- Mid branches -->
      <line x1="64" y1="64" x2="45" y2="52" stroke-width="4"/>
      <line x1="64" y1="64" x2="83" y2="52" stroke-width="4"/>
      <line x1="64" y1="64" x2="45" y2="76" stroke-width="4"/>
      <line x1="64" y1="64" x2="83" y2="76" stroke-width="4"/>
    </g>
    <g transform="rotate(60, 64, 64)">
      <line x1="64" y1="14" x2="64" y2="114" stroke-width="7"/>
      <line x1="64" y1="36" x2="45" y2="22" stroke-width="5"/>
      <line x1="64" y1="36" x2="83" y2="22" stroke-width="5"/>
      <line x1="64" y1="92" x2="45" y2="106" stroke-width="5"/>
      <line x1="64" y1="92" x2="83" y2="106" stroke-width="5"/>
      <line x1="64" y1="64" x2="45" y2="52" stroke-width="4"/>
      <line x1="64" y1="64" x2="83" y2="52" stroke-width="4"/>
      <line x1="64" y1="64" x2="45" y2="76" stroke-width="4"/>
      <line x1="64" y1="64" x2="83" y2="76" stroke-width="4"/>
    </g>
    <g transform="rotate(120, 64, 64)">
      <line x1="64" y1="14" x2="64" y2="114" stroke-width="7"/>
      <line x1="64" y1="36" x2="45" y2="22" stroke-width="5"/>
      <line x1="64" y1="36" x2="83" y2="22" stroke-width="5"/>
      <line x1="64" y1="92" x2="45" y2="106" stroke-width="5"/>
      <line x1="64" y1="92" x2="83" y2="106" stroke-width="5"/>
      <line x1="64" y1="64" x2="45" y2="52" stroke-width="4"/>
      <line x1="64" y1="64" x2="83" y2="52" stroke-width="4"/>
      <line x1="64" y1="64" x2="45" y2="76" stroke-width="4"/>
      <line x1="64" y1="64" x2="83" y2="76" stroke-width="4"/>
    </g>
  </g>

  <!-- Center dot -->
  <circle cx="64" cy="64" r="7" fill="white"/>
</svg>
