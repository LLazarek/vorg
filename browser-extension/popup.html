<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>OrgHTML Snapshot</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, sans-serif;
        width: 280px;
        padding: 14px;
        background: #fff;
        color: #1a1a1a;
      }
      h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
      .field { margin-bottom: 10px; }
      .field label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; }
      .field input {
        width: 100%;
        padding: 5px 8px;
        font-size: 13px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .row { display: flex; gap: 8px; margin-top: 12px; }
      button {
        flex: 1;
        padding: 6px 10px;
        font-size: 13px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #f5f5f5;
        cursor: pointer;
      }
      button:hover { background: #e8e8e8; }
      button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
      button.primary:hover { background: #1d4ed8; }
      button:disabled { opacity: 0.5; cursor: default; }
      #status {
        margin-top: 10px;
        font-size: 12px;
        padding: 6px 8px;
        border-radius: 4px;
        min-height: 28px;
      }
      #status.ok { background: #dcfce7; color: #166534; }
      #status.error { background: #fee2e2; color: #991b1b; }
      #status.muted { color: #888; }
    </style>
  </head>
  <body>
    <h2>OrgHTML Snapshot</h2>
    <div id="link-status" class="muted" style="margin-bottom: 12px; font-size: 12px; padding: 6px 8px; border-radius: 4px; background: #f5f5f5;">Checking tab…</div>
    <div class="field">
      <label for="port">Server port</label>
      <input type="number" id="port" min="1024" max="65535" value="8765">
    </div>
    <div class="row">
      <button id="connect" class="primary">Connect</button>
      <button id="freeze">Freeze tab</button>
    </div>
    <div id="status" class="muted">Not connected.</div>
    <script src="popup.js"></script>
  </body>
</html>
